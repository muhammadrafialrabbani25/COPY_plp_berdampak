[project]
name = "proyek-kelompok"
version = "0.1.0"
description = "Proyek kelompok: analisis kode dengan tree-sitter"
requires-python = ">=3.12"
dependencies = [
    "tree-sitter",
    # Tambahkan paket grammar bahasa yang Anda urai di sini, misalnya:
    # "tree-sitter-python",
    # "tree-sitter-javascript",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
